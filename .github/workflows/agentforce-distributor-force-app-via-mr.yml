# Metadata reaches the default branch only through a pull request
# (docs/engineering/development-foundation.md §1.4). The pre-push hook stops a direct push locally;
# this catches one that got past it and turns the default branch's run red. A branch ruleset that
# requires a pull request for the whole branch makes this job moot; it stays for projects that let
# documentation go straight to the default branch.
name: Agentforce Distributor · Metadata through pull requests

on:
  push:
    branches: ["master"]

permissions:
  contents: read

defaults:
  run:
    working-directory: projects/agentforce-distributor

jobs:
  force-app-via-mr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash tools/ci/force-app-via-mr.sh "${{ github.event.before }}" "${{ github.sha }}"
