# gitleaks on the commits a pull request or a push brings (docs/engineering/development-foundation.md
# §1.5). Runs on every change, documentation included. Findings are uploaded to code scanning, redacted.
name: Agentforce Distributor · Secrets

on:
  pull_request:
  push:
    branches: ["master"]

permissions:
  contents: read
  security-events: write

defaults:
  run:
    working-directory: projects/agentforce-distributor

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" | tar -xz -C /usr/local/bin gitleaks
      - name: Scan
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: sh tools/ci/secrets.sh "$BASE" "$HEAD"
      - uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('projects/agentforce-distributor/reports/gitleaks.sarif') != ''
        with:
          sarif_file: projects/agentforce-distributor/reports/gitleaks.sarif
          category: gitleaks
