# Apex: validates the whole build folder against the CI sandbox with every test class in it — a dry run,
# nothing is written (docs/engineering/development-foundation.md §1.5, docs/engineering/ci-cd.md).
# While the build is in active development, tests run only when someone asks for them
# (development-foundation.md §1.3), so this workflow is started by hand on the branch to validate
# (Actions → Apex validate → Run workflow). Needs the SF_CI_AUTH_URL secret, the SFDX auth URL of a
# sandbox user; SF_CI_DEPLOY_ARGS (a variable) takes the org's own flags, such as --exclude <path>.
name: Agentforce Distributor · Apex validate

on:
  workflow_dispatch:

concurrency:
  group: agentforce-distributor-apex-validate
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  SF_CLI_VERSION: "2.159.7"
  SF_DISABLE_TELEMETRY: "true"
  SF_AUTOUPDATE_DISABLE: "true"
  SF_HIDE_RELEASE_NOTES: "true"

defaults:
  run:
    working-directory: projects/agentforce-distributor

jobs:
  apex-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --global --no-fund --no-audit "@salesforce/cli@${SF_CLI_VERSION}" > /dev/null
      - name: Validate
        env:
          SF_CI_AUTH_URL: ${{ secrets.SF_CI_AUTH_URL }}
          SF_CI_DEPLOY_ARGS: ${{ vars.SF_CI_DEPLOY_ARGS }}
        run: bash tools/ci/apex-validate.sh run
      - name: Cancel the validation in the org
        if: cancelled()
        run: bash tools/ci/apex-validate.sh cancel
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apex-junit
          path: projects/agentforce-distributor/reports/apex/junit/junit.xml
          if-no-files-found: ignore
