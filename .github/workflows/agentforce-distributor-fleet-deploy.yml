# Fleet deploy: the same build to a group of orgs, validate first, then deploy
# (docs/engineering/ci-cd.md, *Fleet deploy*). Started by hand: Actions → Fleet deploy → Run workflow.
#
# Orgs and groups are listed in config/orgs.json (aliases and groups only). Each org maps to a GitHub
# Environment that holds that org's secrets and, for production, its required reviewers: the secrets
# are scoped to the environment, never to the repository, so a run for one org cannot read another's.
#
# Per org, the source is config/overlays/<alias>/package.xml when it exists, else the feature's manifest
# (manifest/features/<feature>.xml) when a feature is given, else the whole build folder.
name: Agentforce Distributor · Fleet deploy

on:
  workflow_dispatch:
    inputs:
      target_group:
        description: Org group from config/orgs.json (for example wave-1)
        required: true
        type: string
      mode:
        description: validate (check only) or deploy
        required: true
        type: choice
        options: [validate, deploy]
        default: validate
      test_level:
        description: Apex test level (NoTestRun is refused for a group with a production org)
        required: true
        type: choice
        options: [RunSpecifiedTests, RunLocalTests, NoTestRun]
        default: RunLocalTests
      test_names:
        description: Test classes for RunSpecifiedTests, comma-separated
        required: false
        type: string
      feature:
        description: Feature slug from project.config.json; empty deploys the whole build folder
        required: false
        type: string
      max_parallel:
        description: How many orgs run at once
        required: true
        type: number
        default: 2

concurrency:
  group: agentforce-distributor-fleet-deploy-${{ inputs.target_group }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  SF_CLI_VERSION: "2.159.7"
  SF_DISABLE_TELEMETRY: "true"
  SF_AUTOUPDATE_DISABLE: "true"
  SF_HIDE_RELEASE_NOTES: "true"

defaults:
  run:
    working-directory: projects/agentforce-distributor

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      orgs: ${{ steps.plan.outputs.orgs }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          GROUP: ${{ inputs.target_group }}
          MODE: ${{ inputs.mode }}
          TEST_LEVEL: ${{ inputs.test_level }}
        run: |
          orgs=$(node tools/ci/fleet-plan.mjs "$GROUP" "$MODE" "$TEST_LEVEL")
          echo "orgs=$orgs" >> "$GITHUB_OUTPUT"
          {
            echo "### Fleet deploy: $MODE to $GROUP ($TEST_LEVEL)"
            echo
            echo "| Org | Environment | Production |"
            echo "|---|---|---|"
            echo "$orgs" | jq -r '.[] | "| \(.alias) | \(.environment) | \(.production) |"'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix:
        org: ${{ fromJSON(needs.plan.outputs.orgs) }}
    environment: ${{ matrix.org.environment }}
    name: ${{ inputs.mode }} ${{ matrix.org.alias }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --global --no-fund --no-audit "@salesforce/cli@${SF_CLI_VERSION}" > /dev/null

      - name: Log in (JWT)
        env:
          ALIAS: ${{ matrix.org.alias }}
          SF_JWT_KEY: ${{ secrets.SF_JWT_KEY }}
          SF_CONSUMER_KEY: ${{ secrets.SF_CONSUMER_KEY }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_INSTANCE_URL: ${{ secrets.SF_INSTANCE_URL }}
        run: |
          key="$RUNNER_TEMP/jwt.key"
          (umask 077; printf '%s\n' "$SF_JWT_KEY" > "$key")
          sf org login jwt --client-id "$SF_CONSUMER_KEY" --jwt-key-file "$key" \
            --username "$SF_USERNAME" --instance-url "$SF_INSTANCE_URL" --alias "$ALIAS" > /dev/null

      - name: ${{ inputs.mode }}
        env:
          ALIAS: ${{ matrix.org.alias }}
          MODE: ${{ inputs.mode }}
          TEST_LEVEL: ${{ inputs.test_level }}
          TEST_NAMES: ${{ inputs.test_names }}
          FEATURE: ${{ inputs.feature }}
        run: |
          set -euo pipefail
          build=$(jq -r '.buildDir' project.config.json)
          if [ -f "config/overlays/$ALIAS/package.xml" ]; then
            source=(--manifest "config/overlays/$ALIAS/package.xml")
          elif [ -n "$FEATURE" ]; then
            [ -f "manifest/features/$FEATURE.xml" ] || { echo "No manifest for feature $FEATURE." >&2; exit 1; }
            source=(--manifest "manifest/features/$FEATURE.xml")
          else
            source=(--source-dir "$build")
          fi
          tests=()
          if [ "$TEST_LEVEL" = "RunSpecifiedTests" ]; then
            [ -n "$TEST_NAMES" ] || { echo "RunSpecifiedTests needs test_names." >&2; exit 1; }
            IFS=',' read -r -a names <<< "$TEST_NAMES"
            for name in "${names[@]}"; do tests+=(--tests "$(echo "$name" | xargs)"); done
          fi
          if [ "$MODE" = "deploy" ]; then action=start; else action=validate; fi
          sf project deploy "$action" "${source[@]}" --target-org "$ALIAS" \
            --test-level "$TEST_LEVEL" "${tests[@]}" --wait 90 --verbose

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/jwt.key"

      - name: Summary
        if: always()
        env:
          ALIAS: ${{ matrix.org.alias }}
          STATUS: ${{ job.status }}
        run: echo "| $ALIAS | $STATUS |" >> "$GITHUB_STEP_SUMMARY"
