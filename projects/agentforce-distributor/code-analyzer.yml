# Salesforce Code Analyzer v5 settings for this practice project.
# Only what differs from the analyzer's defaults lives here. Run it with `npm run scan`.

ignores:
    files:
        - "**/node_modules/**"
        - ".worktrees/**"
        - "IlluminatedCloud/**"
        # Third-party code, kept as its authors published it.
        - "**/vendor/**"

rules:
    pmd:
        # ApexDoc on every method is not one of this project's rules (docs/rules.md).
        ApexDoc:
            disabled: true

# The project's own checks, each tagged Recommended by default, so `npm run scan` and the pipeline run them.
# A new one gets a rule ID in docs/rules.md in the same commit.
engines:
    regex:
        custom_rules:
            # MDT-16: a label's short description becomes its MasterLabel, which Salesforce keeps to 80 characters; a longer
            # one fails the deployment, and with it every class that reads the label. The match starts at the label's
            # <fullName>, so the finding's line is the label's name; it expects <fullName> before <shortDescription>, the
            # order Salesforce writes. An entity such as &apos; counts as the one character it stands for.
            LabelShortDescriptionMax80:
                regex: '/<fullName>[^<]*<\/fullName>(?:(?!<\/labels>)[\s\S])*?<shortDescription>(?:[^<&]|&[^;<]*;){81,}<\/shortDescription>/g'
                file_extensions: [".labels-meta.xml"]
                description: "A custom label's short description is at most 80 characters, the most Salesforce takes for its MasterLabel (MDT-16)."
                violation_message: "This label's short description is over 80 characters: the deployment refuses it (MasterLabel maximum length is 80) and the classes that read the label do not compile. Shorten it to 80 or fewer (MDT-16)."
                severity: "Moderate"

# Findings that stay by design. Each entry names the rule, the most findings it may hide in that file, and
# why; a new finding of the same rule beyond the count still shows. Paths are relative to the build folder
# force-app/distributor.
suppressions:
    disable_suppressions: false
    "classes/DstDatabaseDml.cls":
        # Every Database call passes the AccessLevel the caller's DstDmlMode names (USER_MODE or SYSTEM_MODE), and
        # each system mode carries its reason at the call (SEC-04); PMD cannot read a level held in a variable.
        - rule_selector: "pmd:ApexCRUDViolation"
          max_suppressed_violations: 12
